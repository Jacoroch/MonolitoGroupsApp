apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        # El nombre de la imagen que construiremos localmente
        image: groupsapp-frontend:latest
        # IMPORTANTE: Esto le dice a K8s que use la imagen local y no la busque en internet
        imagePullPolicy: Never 
        ports:
        - containerPort: 3000
        env:
        # Estas variables las lee el navegador de tu usuario
        - name: NEXT_PUBLIC_API_URL
          value: "http://localhost:8000"
        - name: NEXT_PUBLIC_WS_URL
          value: "ws://localhost:8000"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  # Usamos NodePort para poder acceder desde nuestro navegador local
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30000 # Se podrá acceder en la IP de Minikube en este puerto