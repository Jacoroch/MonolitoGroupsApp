---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_NAME
        # ✅ NUEVA VARIABLE: El script usará esto para saber qué DBs crear
        - name: POSTGRES_MULTIPLE_DATABASES
          value: "auth_db,groups_db,messages_db"
        
        # ✅ CONFIGURACIÓN DEL VOLUMEN (MONTAJE)
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init-multiple-databases.sh
          subPath: init-multiple-databases.sh
      
      # ✅ REFERENCIA AL CONFIGMAP
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-script
          defaultMode: 0755 # Permiso de ejecución (rwxr-xr-x)