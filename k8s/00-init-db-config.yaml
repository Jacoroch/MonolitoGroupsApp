apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init-multiple-databases.sh: |
    #!/bin/bash
    set -e
    set -u

    function create_user_and_database() {
        local database=$1
        # ✅ VERIFICACIÓN: Consultamos si la DB ya existe
        local exists=$(psql -U "$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$database'")
        
        if [ "$exists" = "1" ]; then
            echo "  Database '$database' already exists. Skipping."
        else
            echo "  Creating database '$database'..."
            psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -d postgres -c "CREATE DATABASE $database;"
        fi
    }

    if [ -n "$POSTGRES_MULTIPLE_DATABASES" ]; then
        echo "Multiple database creation requested: $POSTGRES_MULTIPLE_DATABASES"
        for db in $(echo $POSTGRES_MULTIPLE_DATABASES | tr ',' ' '); do
            create_user_and_database $db
        done
        echo "✅ All databases are ready."
    fi