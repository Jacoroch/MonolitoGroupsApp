apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
spec:
  replicas: 1 # Si la cola de mensajes crece, ¡aquí podrías poner 5 obreros! # ----------- REPLICAS ----------- REPLICAS ----------- REPLICAS ----------- REPLICAS -----------
  selector:
    matchLabels:
      app: messaging-worker
  template:
    metadata:
      labels:
        app: messaging-worker
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.28
        command: ['sh', '-c', "until nc -zv postgres-service 5432; do echo waiting for postgres; sleep 2; done;"]
      containers:
      - name: messaging-worker
        #image: gruops-app_micro-messaging-worker:latest
        image: 297570491771.dkr.ecr.us-east-1.amazonaws.com/groupsapp-backend:latest
        imagePullPolicy: Never
        command: ["python3", "modules/consumers/messaging_worker.py"]
        envFrom:
        - configMapRef:
            name: app-config # Toma automáticamente RABBITMQ_HOST
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_NAME
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@groups-app-db.cluster-ciphu7kcxcvs.us-east-1.rds.amazonaws.com:5432/auth_db"