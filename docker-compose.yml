services:
  # 1. Base de Datos
  postgres-service:
    image: postgres:15-alpine
    container_name: postgres-server
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: auth_db
      POSTGRES_MULTIPLE_DATABASES: groups_db,messages_db
    volumes:
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Auth
  auth-grpc:
    build: .
    container_name: auth-grpc-server
    command: python3 -m modules.auth.grpc_server
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-service:5432/auth_db
      - AUTH_DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-service:5432/auth_db
      - CONSUL_HOST=consul-server
      - CONSUL_PORT=8500
    depends_on:
      postgres-service:
        condition: service_healthy
      consul:
        condition: service_started

  # 4. Grupos
  groups-grpc:
    build: .
    container_name: groups-grpc-server
    command: python3 -m modules.groups.grpc_server
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-service:5432/groups_db
      - GROUPS_DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-service:5432/groups_db
      - CONSUL_HOST=consul-server
      - CONSUL_PORT=8500
    depends_on:
      postgres-service:
        condition: service_healthy
      consul:
        condition: service_started

  # 5. Worker
  messaging-worker:
    build: .
    container_name: messaging-worker
    command: python3 modules/consumers/messaging_worker.py
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-service:5432/messages_db
      - MESSAGES_DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-service:5432/messages_db
      - GROUPS_SERVER_URL=groups-grpc-server:50052  
      - RABBITMQ_HOST=rabbitmq-server
    depends_on:
      postgres-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 6. API Gateway
  api-gateway:
    build: .
    container_name: fastapi-gateway
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AUTH_DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-service:5432/auth_db
      - GROUPS_DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-service:5432/groups_db
      - MESSAGES_DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-service:5432/messages_db
      - AUTH_SERVER_URL=auth-grpc-server:50051      
      - GROUPS_SERVER_URL=groups-grpc-server:50052  
      - PRESENCE_SERVER_URL=presence-grpc-server:50053 
      - RABBITMQ_HOST=rabbitmq-server
      - CONSUL_HOST=consul-server
      - CONSUL_PORT=8500
    depends_on:
      postgres-service:
        condition: service_healthy
      consul:
        condition: service_started

  # 7. Servicio de Presencia 
  presence-grpc:
    build: .
    container_name: presence-grpc-server
    command: python3 -m modules.presence.grpc_server
    env_file:
      - .env
    environment:
      - CONSUL_HOST=consul-server
      - CONSUL_PORT=8500
    depends_on:
      consul:
        condition: service_started

  # 8. Frontend
  frontend:
    build: 
      context: ./frontend 
    container_name: nextjs-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - api-gateway

  # 9. Consul
  consul:
    image: consul:1.15
    container_name: consul-server
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"