
services:
  # 1. Base de Datos (Configurada para Multi-DB)
  postgres:
    image: postgres:15-alpine
    container_name: postgres-server
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: auth_db # La base de datos principal
      POSTGRES_MULTIPLE_DATABASES: groups_db,messages_db # Las adicionales
    volumes:
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Auth (Usa auth_db)
  auth-grpc:
    build: .
    container_name: auth-grpc-server
    command: python3 -m modules.auth.grpc_server
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/auth_db
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Grupos (Usa groups_db)
  groups-grpc:
    build: .
    container_name: groups-grpc-server
    command: python3 -m modules.groups.grpc_server
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/groups_db
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Worker (Usa messages_db)
  messaging-worker:
    build: .
    container_name: messaging-worker
    command: python3 modules/consumers/messaging_worker.py
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/messages_db
      - GROUPS_SERVER_URL=groups-grpc-server:50052  # <--- NUEVO: Para que el worker encuentre a Grupos
      - RABBITMQ_HOST=rabbitmq-server
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 6. API Gateway (Punto de entrada)
  api-gateway:
    build: .
    container_name: fastapi-gateway
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/auth_db
      - AUTH_SERVER_URL=auth-grpc-server:50051      # <--- NUEVO: Para validar tokens HTTP y WebSockets
      - GROUPS_SERVER_URL=groups-grpc-server:50052  # <--- NUEVO: Para validar membresías
      - RABBITMQ_HOST=rabbitmq-server
    depends_on:
      postgres:
        condition: service_healthy

# 7. Frontend (Next.js)
  frontend:
    build: 
      context: ./frontend # Ajusta si tu carpeta se llama distinto
    container_name: nextjs-frontend
    ports:
      - "3000:3000"
    environment:
      # URL que usará el navegador del usuario para llegar al backend
      - NEXT_PUBLIC_API_URL=http://0.0.0.0:8000
      - NEXT_PUBLIC_WS_URL=ws://0.0.0.0:8000
    depends_on:
      - api-gateway